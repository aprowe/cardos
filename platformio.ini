; CardOS -- M5Stack Cardputer (ESP32-S3FN8, 8 MB flash, no PSRAM)
;
; ESP-IDF, not Arduino: the radio blobs are IDF-only and everything above the
; HAL is ours. The host test suite lives in host/ and is built by build.bat --
; it does not go through PlatformIO.
;
; Two builds of the same source. `cardputer` is the debug one: -Og, INFO logs,
; what a plain `platformio run` builds and what USB flashes. `release` is -O2
; with WARN logs (sdkconfig.release.defaults on top of sdkconfig.defaults);
; build it with `-e release`. The server offers both under /update, and a
; device updates to the flavor it is running unless told otherwise
; (`update os release`, `update all debug`).

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32 @ 7.1.2
board = m5stack-stamps3
framework = espidf
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
board_build.partitions = partitions.csv
build_flags =
    -DCARDOS_DEVICE=1

[env:release]
extends = env:cardputer
build_flags =
    ${env:cardputer.build_flags}
    -DCARDOS_RELEASE=1
    ; -O2 follows value ranges that -Og does not, and flags every snprintf
    ; and strncpy that could cut its output short. Here that is always on
    ; purpose (a bounded buffer is the point), so those stay warnings, not
    ; errors.
    -Wno-error=format-truncation
    -Wno-error=stringop-truncation
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.release.defaults
